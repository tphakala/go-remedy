name: govulncheck

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly on Monday at 08:00 UTC so a newly disclosed stdlib or dependency
    # vulnerability is caught even when nothing has been pushed.
    - cron: "0 8 * * 1"

permissions:
  contents: read

jobs:
  govulncheck:
    name: Vulnerability Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # No job here pushes, so keep the token out of .git/config.
          persist-credentials: false

      # Set the Go version from go.mod explicitly rather than via
      # golang/govulncheck-action, whose default go-version-input (stable) would
      # take precedence over go-version-file and scan with a different toolchain
      # than the project declares. go.mod pins the minor (go 1.27), so
      # check-latest tracks the newest 1.27.x patch and its stdlib security
      # fixes without a second version to keep in sync.
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: govulncheck ./...
