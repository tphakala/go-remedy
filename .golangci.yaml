# golangci-lint v2 configuration.
#
# The linter version is pinned once, in .golangci-version; CI and `task tools`
# read it from there so the local and CI runs use the same binary. Validate an
# edit to this file with `golangci-lint config verify` before relying on it.
#
# Policy: strict by default. A linter is disabled here only with a written
# reason, and a finding is silenced at the call site only with a
# `//nolint:<linter> // <reason>` directive (nolintlint enforces both parts).
version: "2"

run:
  timeout: 5m
  modules-download-mode: readonly

output:
  sort-order:
    - linter
    - severity
    - file

# golangci-lint v2 runs formatters from this top-level key, not from
# linters.enable. Without it, `golangci-lint run` reports no formatting issues.
formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    gofumpt:
      extra:
        group-params: true
    goimports:
      local-prefixes:
        - github.com/tphakala/go-remedy

linters:
  # The v2 "standard" default set (errcheck, govet, ineffassign, staticcheck,
  # unused) stays enabled; the list below adds to it.
  enable:
    - asciicheck
    - bidichk
    - bodyclose
    - canonicalheader
    - containedctx
    - contextcheck
    - copyloopvar
    - decorder
    - depguard
    - dupl
    - durationcheck
    - embeddedstructfieldcheck
    - errchkjson
    - errname
    - errorlint
    - exhaustive
    - exptostd
    - fatcontext
    - forcetypeassert
    - gocheckcompilerdirectives
    - gochecknoinits
    - gocognit
    - goconst
    - gocritic
    - godoclint
    - gocyclo
    - gosec
    - iface
    - makezero
    - misspell
    - mnd
    # modernize stays disabled on purpose: rules/*.go (ruleguard) carry the
    # Go 1.20 through Go 1.27 modernization patterns instead. Enabling both
    # would make the two fight over the same line under uniq-by-line, with the
    # surviving message chosen by run order rather than by quality.
    #- modernize
    - musttag
    - nakedret
    - nilerr
    - nilnesserr
    - nilnil
    - noctx
    - nolintlint
    - nosprintfhostport
    - perfsprint
    - prealloc
    - predeclared
    - reassign
    - recvcheck
    - revive
    - sloglint
    - testifylint
    - thelper
    - tparallel
    - unconvert
    - unparam
    - usestdlibvars
    - usetesting
    - wastedassign
    # Not enabled: rowserrcheck, sqlclosecheck and spancheck. This library has
    # no database/sql or tracing code for them to inspect.

  settings:
    depguard:
      rules:
        # Deprecated or superseded packages, banned everywhere.
        deprecated:
          list-mode: lax
          deny:
            - pkg: "io/ioutil"
              desc: "deprecated since Go 1.16; use the io and os packages"
            - pkg: "github.com/pkg/errors"
              desc: "use the standard errors package (errors.Is/As/AsType, %w)"
            - pkg: "golang.org/x/exp/slices"
              desc: "use the standard slices package"
            - pkg: "golang.org/x/exp/maps"
              desc: "use the standard maps package"
            - pkg: "golang.org/x/exp/constraints"
              desc: "use the standard cmp package or a local constraint"
            - pkg: "math/rand$"
              desc: "use math/rand/v2 (or crypto/rand for secrets)"
        # The library promises consumers a stdlib-only runtime, so non-test
        # code may import only the standard library and this module. Tests may
        # use testify.
        runtime:
          list-mode: strict
          files:
            - "!$test"
          allow:
            - "$gostd"
            - "github.com/tphakala/go-remedy"
          deny:
            - pkg: "log$"
              desc: "library code must not log; return an error to the caller"
    dupl:
      threshold: 120
    errcheck:
      check-type-assertions: true
    exhaustive:
      # A switch with a default branch is treated as exhaustive.
      default-signifies-exhaustive: true
    goconst:
      # Test literals are clearer inline than behind shared constants.
      ignore-tests: true
    gocognit:
      # Stricter than the template default (20): every function in this
      # library is small request plumbing, and 12 keeps it that way.
      min-complexity: 12
    gocritic:
      disabled-checks:
        - commentFormatting
        - commentedOutCode
      enabled-tags:
        - style
        - diagnostic
        - performance
      settings:
        # gocritic auto-enables its ruleguard check when settings.ruleguard.rules
        # is set. The rules/*.go matchers carry the //go:build ruleguard tag so
        # the normal toolchain ignores them; `go vet -tags ruleguard ./rules/`
        # compiles them as a canary and `go test ./rules/rulestest/` runs each
        # matcher against rules/testdata/probe.
        ruleguard:
          # Fail the run when a rule file does not parse or imports a package
          # that cannot be found, instead of silently dropping the whole file.
          failOn: all
          # ${base-path} is the directory holding this config file, so the glob
          # resolves the same way regardless of the working directory.
          rules: "${base-path}/rules/*.go"
    gocyclo:
      min-complexity: 15
    gosec:
      # No severity or confidence floor: G101 (hardcoded credentials) is
      # emitted below a medium confidence floor, and this library handles
      # credentials. Exclude specific rule IDs with a written reason instead.
      excludes:
        - G104 # Audit errors not checked (covered by errcheck)
    govet:
      enable-all: true
      disable:
        # fieldalignment optimizes struct layout for memory at the cost of
        # readability; it is a per-struct decision, not a lint gate.
        - fieldalignment
        # shadow flags the idiomatic `if x, err := f(); err != nil` inside a
        # function that already has an err in scope. Too noisy to gate on.
        - shadow
    nolintlint:
      allow-unused: false
      require-explanation: true
      require-specific: true
    prealloc:
      simple: true
      range-loops: true
      for-loops: true
    revive:
      # golangci-lint replaces revive's default rule set with this list as soon
      # as `rules` is non-empty, so the defaults are spelled out here (minus
      # unused-parameter, whose `_` rewrites hurt readability of interface
      # implementations) and a few extra correctness rules are added.
      rules:
        - name: atomic
        - name: bare-return
        - name: blank-imports
        - name: bool-literal-in-expr
        - name: constant-logical-expr
        - name: context-as-argument
        - name: context-keys-type
        - name: datarace
        - name: defer
        - name: dot-imports
        - name: duplicated-imports
        - name: early-return
        - name: empty-block
        - name: error-naming
        - name: error-return
        - name: error-strings
        - name: errorf
        - name: identical-branches
        - name: if-return
        - name: increment-decrement
        - name: indent-error-flow
        - name: modifies-value-receiver
        - name: package-comments
        - name: range
        - name: range-val-address
        - name: range-val-in-closure
        - name: receiver-naming
        - name: redefines-builtin-id
        - name: redundant-import-alias
        - name: string-of-int
        - name: struct-tag
        - name: superfluous-else
        - name: time-equal
        - name: time-naming
        - name: unconditional-recursion
        - name: unexported-return
        - name: unnecessary-stmt
        - name: unreachable-code
        - name: unused-receiver
        - name: use-any
        - name: useless-break
        - name: var-declaration
        - name: var-naming
        - name: waitgroup-by-value
    sloglint:
      no-mixed-args: true
      static-msg: true
    staticcheck:
      checks:
        - all
    testifylint:
      enable-all: true
    usetesting:
      # Both default to false upstream; without them usetesting does not flag
      # context.Background()/context.TODO() in tests at all.
      context-background: true
      context-todo: true

  exclusions:
    generated: lax
    rules:
      # Tests repeat setup on purpose and pin inputs by literal.
      - path: '_test\.go$'
        linters:
          - dupl
          - gocognit
          - goconst
      # Tests read fixtures by computed path (G304) and run tools they locate
      # at runtime (G204); neither input comes from outside the repository.
      # Every other gosec rule still applies to tests.
      - path: '_test\.go$'
        linters:
          - gosec
        text: 'G(204|304):'

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  uniq-by-line: true
  new: false
